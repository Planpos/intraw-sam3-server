<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAM3 Point Segmentation Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #111;
      color: #e0e0e0;
      padding: 24px;
    }

    h1 { font-size: 20px; font-weight: 600; margin-bottom: 18px; color: #fff; }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s;
    }
    .btn-primary  { background: #2563eb; color: #fff; }
    .btn-primary:hover  { background: #1d4ed8; }
    .btn-secondary { background: #374151; color: #e0e0e0; }
    .btn-secondary:hover { background: #4b5563; }
    .btn:disabled { background: #374151; color: #6b7280; cursor: not-allowed; }

    /* 모드 토글 */
    .mode-group { display: flex; border-radius: 7px; overflow: hidden; border: 1px solid #374151; }
    .mode-btn {
      padding: 7px 16px;
      border: none;
      background: #1f2937;
      color: #9ca3af;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }
    .mode-btn:first-child { border-right: 1px solid #374151; }
    .mode-btn.active { background: #2563eb; color: #fff; }
    .mode-btn:hover:not(.active) { background: #374151; color: #e0e0e0; }

    input[type="file"] { display: none; }

    .canvas-area {
      position: relative;
      display: inline-block;
      border: 1px solid #2d2d2d;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    #main-canvas   { display: block; max-width: min(900px, calc(100vw - 48px)); }
    #overlay-canvas {
      position: absolute; top: 0; left: 0;
      pointer-events: none;
      max-width: min(900px, calc(100vw - 48px));
    }

    #upload-hint {
      width: 600px;
      max-width: calc(100vw - 48px);
      height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #6b7280;
      font-size: 14px;
      cursor: pointer;
      border: 2px dashed #2d2d2d;
      border-radius: 8px;
    }
    #upload-hint:hover { border-color: #4b5563; }
    #upload-hint svg { opacity: 0.4; }

    #status { margin-top: 12px; font-size: 13px; color: #6b7280; min-height: 18px; }

    .info-panel {
      margin-top: 14px;
      background: #1c1c1c;
      border: 1px solid #2d2d2d;
      border-radius: 8px;
      padding: 14px;
      font-size: 13px;
      display: none;
      max-width: min(900px, calc(100vw - 48px));
    }
    .info-title { font-weight: 600; color: #d1d5db; margin-bottom: 10px; }
    .det-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 0; border-bottom: 1px solid #252525;
      font-size: 12px; color: #9ca3af;
    }
    .det-row:last-child { border-bottom: none; }
    .swatch { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
    .score-val { color: #34d399; font-weight: 600; }
    .box-val   { color: #94a3b8; }

    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid #374151; border-top-color: #2563eb;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<h1>SAM3 Segmentation Demo</h1>

<div class="controls">
  <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">이미지 업로드</button>
  <input type="file" id="file-input" accept="image/*">

  <div class="mode-group">
    <button class="mode-btn active" id="btn-point" onclick="setMode('point')">클릭</button>
    <button class="mode-btn"        id="btn-box"   onclick="setMode('box')">드래그</button>
  </div>

  <button class="btn btn-secondary" id="clear-btn" disabled onclick="clearOverlay()">초기화</button>
</div>

<div id="upload-hint" onclick="document.getElementById('file-input').click()">
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="3" y="3" width="18" height="18" rx="2"/>
    <circle cx="8.5" cy="8.5" r="1.5"/>
    <polyline points="21 15 16 10 5 21"/>
  </svg>
  클릭해서 이미지를 업로드하세요
</div>

<div class="canvas-area" id="canvas-area" style="display:none">
  <canvas id="main-canvas"></canvas>
  <canvas id="overlay-canvas"></canvas>
</div>

<div id="status">이미지를 업로드하세요.</div>
<div class="info-panel" id="info-panel"></div>

<script>
  const API = 'http://localhost:8001';

  const COLORS = [
    [76,  195, 247],
    [255, 138, 101],
    [129, 199, 132],
    [255, 213,  79],
    [186, 104, 200],
  ];

  const mainCanvas    = document.getElementById('main-canvas');
  const overlayCanvas = document.getElementById('overlay-canvas');
  const mainCtx       = mainCanvas.getContext('2d');
  const overlayCtx    = overlayCanvas.getContext('2d');
  const canvasArea    = document.getElementById('canvas-area');
  const uploadHint    = document.getElementById('upload-hint');

  let originalFile = null;
  let imgW = 0, imgH = 0;
  let isLoading = false;
  let mode = 'point'; // 'point' | 'box'

  // 드래그 상태
  let isDragging = false;
  let dragStart  = null; // { px, py } 원본 픽셀 좌표

  // ── 이미지 업로드 ──────────────────────────────────────────────
  document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    originalFile = file;
    const img = new Image();
    img.onload = () => {
      imgW = img.naturalWidth;
      imgH = img.naturalHeight;
      mainCanvas.width    = imgW;
      mainCanvas.height   = imgH;
      overlayCanvas.width = imgW;
      overlayCanvas.height = imgH;
      mainCtx.drawImage(img, 0, 0);
      overlayCtx.clearRect(0, 0, imgW, imgH);
      uploadHint.style.display = 'none';
      canvasArea.style.display = 'inline-block';
      document.getElementById('clear-btn').disabled = false;
      document.getElementById('info-panel').style.display = 'none';
      setStatus('객체를 클릭하거나 드래그하세요.');
    };
    img.src = URL.createObjectURL(file);
  });

  // ── 모드 전환 ──────────────────────────────────────────────────
  function setMode(m) {
    mode = m;
    document.getElementById('btn-point').classList.toggle('active', m === 'point');
    document.getElementById('btn-box').classList.toggle('active', m === 'box');
    updateCursor();
  }

  function updateCursor() {
    mainCanvas.style.cursor = isLoading ? 'wait' : 'crosshair';
  }

  // ── 좌표 변환 (CSS → 원본 픽셀) ───────────────────────────────
  function getPixelCoords(e) {
    const rect = mainCanvas.getBoundingClientRect();
    return {
      px: Math.round((e.clientX - rect.left)  * (imgW / rect.width)),
      py: Math.round((e.clientY - rect.top)   * (imgH / rect.height)),
    };
  }

  // ── 마우스 이벤트 ──────────────────────────────────────────────

  // 클릭 (포인트 모드)
  mainCanvas.addEventListener('click', async (e) => {
    if (!originalFile || isLoading || mode !== 'point' || isDragging) return;
    const { px, py } = getPixelCoords(e);
    await runPoint(px, py);
  });

  // 드래그 시작 (박스 모드)
  mainCanvas.addEventListener('mousedown', (e) => {
    if (!originalFile || isLoading || mode !== 'box') return;
    isDragging = true;
    dragStart  = getPixelCoords(e);
  });

  // 드래그 중 — 박스 프리뷰
  mainCanvas.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const { px, py } = getPixelCoords(e);
    overlayCtx.clearRect(0, 0, imgW, imgH);

    const x = Math.min(dragStart.px, px);
    const y = Math.min(dragStart.py, py);
    const w = Math.abs(px - dragStart.px);
    const h = Math.abs(py - dragStart.py);

    // 반투명 채우기
    overlayCtx.fillStyle = 'rgba(37,99,235,0.12)';
    overlayCtx.fillRect(x, y, w, h);
    // 테두리
    overlayCtx.strokeStyle = 'rgba(96,165,250,0.9)';
    overlayCtx.lineWidth   = Math.max(1.5, imgW / 600);
    overlayCtx.setLineDash([Math.max(6, imgW / 150), Math.max(3, imgW / 300)]);
    overlayCtx.strokeRect(x, y, w, h);
    overlayCtx.setLineDash([]);
    // 시작점 점
    drawDot(dragStart.px, dragStart.py, 'rgba(96,165,250,0.9)');
  });

  // 드래그 끝
  mainCanvas.addEventListener('mouseup', async (e) => {
    if (!isDragging) return;
    isDragging = false;
    const { px, py } = getPixelCoords(e);
    const x1 = Math.min(dragStart.px, px);
    const y1 = Math.min(dragStart.py, py);
    const x2 = Math.max(dragStart.px, px);
    const y2 = Math.max(dragStart.py, py);

    // 너무 작은 드래그 무시 (5px 이하)
    if (x2 - x1 < 5 || y2 - y1 < 5) {
      overlayCtx.clearRect(0, 0, imgW, imgH);
      return;
    }
    await runBox(x1, y1, x2, y2);
  });

  // 캔버스 밖으로 나갔을 때 드래그 취소
  mainCanvas.addEventListener('mouseleave', () => {
    if (isDragging) {
      isDragging = false;
      overlayCtx.clearRect(0, 0, imgW, imgH);
    }
  });

  // ── API 호출 ──────────────────────────────────────────────────

  async function runPoint(px, py) {
    setLoading(true);
    setStatus(`(${px}, ${py}) 분석 중...`, true);

    const fd = new FormData();
    fd.append('image', originalFile);
    fd.append('x', px);
    fd.append('y', py);

    const data = await callAPI('/segment-by-point', fd);
    if (data) await renderResult(data, 'point', { px, py });
    setLoading(false);
  }

  async function runBox(x1, y1, x2, y2) {
    setLoading(true);
    setStatus(`박스 (${x1},${y1}) → (${x2},${y2}) 분석 중...`, true);

    const fd = new FormData();
    fd.append('image', originalFile);
    fd.append('x1', x1); fd.append('y1', y1);
    fd.append('x2', x2); fd.append('y2', y2);

    const data = await callAPI('/segment-by-box', fd);
    if (data) await renderResult(data, 'box', { x1, y1, x2, y2 });
    setLoading(false);
  }

  async function callAPI(path, fd) {
    try {
      const res = await fetch(API + path, { method: 'POST', body: fd });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        setStatus(`오류: ${err.detail}`);
        return null;
      }
      return await res.json();
    } catch (err) {
      setStatus(`서버 연결 실패: ${err.message}`);
      return null;
    }
  }

  // ── 결과 렌더링 ───────────────────────────────────────────────

  async function renderResult(data, inputType, coords) {
    overlayCtx.clearRect(0, 0, imgW, imgH);

    if (data.num_detections === 0) {
      setStatus('객체를 찾지 못했습니다.');
      document.getElementById('info-panel').style.display = 'none';
      if (inputType === 'point') drawDot(coords.px, coords.py, 'rgba(239,68,68,0.9)');
      return;
    }

    for (let i = 0; i < data.detections.length; i++) {
      const det   = data.detections[i];
      const color = COLORS[i % COLORS.length];
      await drawMask(det.mask_base64, color);
    }

    // 입력 힌트 표시
    if (inputType === 'point') {
      drawDot(coords.px, coords.py, 'rgba(239,68,68,0.9)');
      setStatus(`(${coords.px}, ${coords.py}) — ${data.num_detections}개 감지`);
    } else {
      setStatus(`박스 드래그 — ${data.num_detections}개 감지`);
    }

    renderInfoPanel(data);
  }

  // ── 드로잉 유틸 ──────────────────────────────────────────────

  function drawMask(base64, color) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const off = document.createElement('canvas');
        off.width = imgW; off.height = imgH;
        off.getContext('2d').drawImage(img, 0, 0, imgW, imgH);
        const src = off.getContext('2d').getImageData(0, 0, imgW, imgH).data;

        const colored = overlayCtx.createImageData(imgW, imgH);
        const dst = colored.data;
        for (let i = 0; i < src.length; i += 4) {
          if (src[i] > 128) {
            dst[i] = color[0]; dst[i+1] = color[1]; dst[i+2] = color[2]; dst[i+3] = 110;
          }
        }
        const tmp = document.createElement('canvas');
        tmp.width = imgW; tmp.height = imgH;
        tmp.getContext('2d').putImageData(colored, 0, 0);
        overlayCtx.drawImage(tmp, 0, 0);
        resolve();
      };
      img.src = 'data:image/png;base64,' + base64;
    });
  }

  function drawBox(box, color) {
    overlayCtx.strokeStyle = `rgb(${color[0]},${color[1]},${color[2]})`;
    overlayCtx.lineWidth   = Math.max(1, imgW / 600);
    overlayCtx.strokeRect(box.x1, box.y1, box.x2 - box.x1, box.y2 - box.y1);
  }

  function drawDot(px, py, color) {
    const r = Math.max(6, imgW / 120);
    overlayCtx.beginPath();
    overlayCtx.arc(px, py, r, 0, Math.PI * 2);
    overlayCtx.fillStyle   = color;
    overlayCtx.fill();
    overlayCtx.strokeStyle = '#fff';
    overlayCtx.lineWidth   = Math.max(1.5, imgW / 500);
    overlayCtx.stroke();
  }

  function drawInputBox(x1, y1, x2, y2) {
    overlayCtx.strokeStyle = 'rgba(96,165,250,0.6)';
    overlayCtx.lineWidth   = Math.max(1.5, imgW / 500);
    overlayCtx.setLineDash([Math.max(6, imgW / 150), Math.max(3, imgW / 300)]);
    overlayCtx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    overlayCtx.setLineDash([]);
  }

  // ── 정보 패널 ─────────────────────────────────────────────────

  function renderInfoPanel(data) {
    const panel = document.getElementById('info-panel');
    let html = `<div class="info-title">감지 결과 — ${data.num_detections}개</div>`;
    data.detections.forEach((det, i) => {
      const c = COLORS[i % COLORS.length];
      const b = det.box;
      html += `
        <div class="det-row">
          <span class="swatch" style="background:rgb(${c[0]},${c[1]},${c[2]})"></span>
          #${i + 1}
          &nbsp; 신뢰도: <span class="score-val">${(det.score * 100).toFixed(1)}%</span>
          &nbsp; 박스: <span class="box-val">[${b.x1}, ${b.y1}, ${b.x2}, ${b.y2}]</span>
        </div>`;
    });
    panel.innerHTML = html;
    panel.style.display = 'block';
  }

  // ── 유틸 ─────────────────────────────────────────────────────

  function clearOverlay() {
    overlayCtx.clearRect(0, 0, imgW, imgH);
    document.getElementById('info-panel').style.display = 'none';
    setStatus('객체를 클릭하거나 드래그하세요.');
  }

  function setLoading(v) {
    isLoading = v;
    updateCursor();
  }

  function setStatus(msg, isHtml = false) {
    const el = document.getElementById('status');
    if (isHtml) el.innerHTML = `<span class="spinner"></span>${msg}`;
    else        el.textContent = msg;
  }
</script>
</body>
</html>
